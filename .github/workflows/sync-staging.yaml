---
name: Sync staging with main
on:
  push:
    branches: [main]
  workflow_dispatch: {}
concurrency:
  group: sync-staging
  cancel-in-progress: false
jobs:
  sync:
    name: Sync staging with main
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout staging
        uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Check for commits in main not yet in staging
        id: diff
        run: |
          git fetch origin main
          if [ -z "$(git log staging..origin/main --oneline)" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi
      - name: List PRs brought in from main
        if: steps.diff.outputs.has_changes == 'true'
        id: prs
        run: |
          PRS=$(git log staging..origin/main --format=%s | python3 -c "
          import re, sys
          seen = []
          for line in sys.stdin:
              for m in re.findall(r'#(\d+)', line):
                  if m not in seen:
                      seen.append(m)
          print(', '.join(f'#{n}' for n in seen))
          ")
          echo "prs=$PRS" >> "$GITHUB_OUTPUT"
      - name: Merge main into staging and push
        if: steps.diff.outputs.has_changes == 'true'
        run: |-
          PRS="${{ steps.prs.outputs.prs }}"
          if [ -n "$PRS" ]; then
            MSG="chore: sync staging and main - (PRs: $PRS)"
          else
            MSG="chore: sync staging and main"
          fi
          git merge origin/main -X ours -m "$MSG"
          git push origin HEAD:staging
