---
name: CI Python
on:
  pull_request:
    paths: ['**.py']
jobs:
  lint:
    name: Lint python
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Lint source code
        uses: astral-sh/ruff-action@v3
        with:
          version: "0.14.9"
  test:
    name: Test python
    runs-on: ubuntu-latest
    services:
      database:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_NAME: postgres
      DB_USER: postgres
      DB_PASSWORD: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up poetry
        run: pipx install poetry
      - name: Set up python
        uses: actions/setup-python@v4
        with:
          cache: poetry
          architecture: x64
          python-version: '3.11'
      - name: Install requirements
        # `--only=test` installed pytest without Django, so pytest aborted with
        # ModuleNotFoundError on every run. The suite imports Django and the
        # project's own apps, so the main group is required too.
        run: poetry install --only main,test
      - name: Test
        # `shell: bash` sets pipefail, so a pytest failure is not swallowed by tee.
        shell: bash
        run: |
          poetry run pytest \
            --junitxml=pytest.xml \
            --cov-report=term-missing:skip-covered \
            --cov=backend backend | tee pytest-coverage.txt
      - name: Report coverage
        if: always()
        uses: MishaKav/pytest-coverage-comment@main
        with:
          hide-report: true
          junitxml-path: ./pytest.xml
          pytest-coverage-path: ./pytest-coverage.txt
