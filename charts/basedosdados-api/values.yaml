---
# API configuration
api:
  # Deployment name
  name: basedosdados-api

  # Deployment image
  image:
    name: ghcr.io/basedosdados/api
    tag: stable  # We use the stable tag for the API as a default
    pullPolicy: Always

  # Number of replicas
  replicas: 1

  # Specifying resources is recommended for production deployments
  resources: {}
  #   limits:
  #     cpu: 100m
  #     memory: 128Mi
  #   requests:
  #     cpu: 100m
  #     memory: 128Mi

  # Additional environment variables to be passed to the API. One must provide all of
  # the environment variables below, either directly or through a secret:
  # - EMAIL_HOST_USER: email address to be used to send emails
  # - EMAIL_HOST_PASSWORD: password for the email address
  # - DJANGO_SECRET_KEY: the Django secret key
  env: []
    # - name: "SOME_ENV"
    #   value: "some_value"
  envFrom: []
    # - secretRef:
    #     name: some-secret

  # Django settings module
  settingsModule: backend.settings.remote
# Tracing (OpenTelemetry) configuration
tracing:
  # Enable the OpenTelemetry Collector sidecar. Disabled by default — the
  # application falls back to no-op tracing when there's nothing listening
  # on OTEL_EXPORTER_OTLP_ENDPOINT.
  enabled: false

  # GCP project to export traces to. Left empty, the googlecloud exporter
  # tries to detect it from the mounted service account / GKE metadata.
  gcpProjectId: ""

  # Fraction of traces to sample (0.0 to 1.0).
  sampleRatio: "0.1"

  collectorImage:
    name: otel/opentelemetry-collector-contrib
    tag: "0.111.0"

  # Resources for the otel-collector sidecar container.
  collectorResources: {}
  #   limits:
  #     cpu: 200m
  #     memory: 256Mi
  #   requests:
  #     cpu: 50m
  #     memory: 128Mi
# Database configuration
database:
  # Hostname of the database
  host: basedosdados-postgres

  # Port of the database
  port: 5432

  # Database name
  name: basedosdados

  # Username
  user: basedosdados

  # Secret containing the password (it must have a key called `password` containing the password)
  passwordSecret: basedosdados-postgres-password
# Ingress configuration
ingress:
  # Enable ingress
  enabled: false

  # Host to be used in the ingress
  host: basedosdados-api.example.com

  # Ingress annotations
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"

  # TLS configuration
  tls: []
    # - secretName: basedosdados-api-tls
    #   hosts:
    #     - basedosdados-api.local
